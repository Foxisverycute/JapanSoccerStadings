html{scroll-padding-top:env(safe-area-inset-top,0px)}

.wrap{max-width:860px;margin:0 auto;padding:18px 14px 40px}

.row{display:flex;gap:12px;flex-wrap:wrap}

.hint{margin:0 0 10px;font-size:12px;color:var(--mut)}
button{font:inherit;cursor:pointer}
.mini{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:5px 10px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--ai);background:var(--ai);color:var(--on);border-radius:999px;padding:7px 14px;font-size:14px}
.chip.off{background:var(--off);color:var(--mut);border-color:var(--line);text-decoration:line-through}
.info{font-size:13px;color:var(--mut);margin-bottom:8px}
.tw{overflow-x:auto}
table{border-collapse:collapse;table-layout:fixed;min-width:640px;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--mut);font-weight:600}

td:first-child{color:var(--mut);text-align:center}
td.pt{font-weight:800;color:var(--ai)}

.src{margin:18px 0 0;text-align:center;font-size:12px;color:var(--mut)}

const PREF="札幌 八戸 岩手 仙台 秋田 山形 福島 いわき 鹿島 水戸 栃木SC 栃木C 群馬 浦和 大宮 柏 千葉 FC東京 東京V 町田 川崎F 横浜FM 横浜FC YS横浜 湘南 相模原 新潟 富山 金沢 甲府 松本 長野 岐阜 清水 磐田 藤枝 沼津 名古屋 滋賀 京都 G大阪 C大阪 FC大阪 神戸 奈良 鳥取 岡山 広島 山口 徳島 讃岐 愛媛 今治 高知 福岡 北九州 鳥栖 長崎 熊本 大分 宮崎 鹿児島 琉球".split(" ");
const pidx=n=>{const i=PREF.indexOf(n);return i<0?999:i};
const teamsOf=ds=>[...new Set(ds.m.flatMap(x=>[x[1],x[4]]))].sort((a,b)=>pidx(a)-pidx(b)||a.localeCompare(b,"ja"));
function calc(ms,set){
  const t={};set.forEach(n=>t[n]={n,p:0,w:0,d:0,pw:0,pl:0,l:0,gf:0,ga:0,pt:0});
  for(const[r,h,a,b,v,pk]of ms){
    if(!set.has(h)||!set.has(v))continue;
    const H=t[h],V=t[v];H.p++;V.p++;H.gf+=a;H.ga+=b;V.gf+=b;V.ga+=a;
    if(a>b){H.w++;V.l++;H.pt+=3}else if(a<b){V.w++;H.l++;V.pt+=3}else if(pk){const hw=pk==="h",W=hw?H:V,L=hw?V:H;W.pw++;L.pl++;W.pt+=2;L.pt+=1}else{H.d++;V.d++;H.pt++;V.pt++}
  }
  return Object.values(t).sort((x,y)=>y.pt-x.pt||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||x.n.localeCompare(y.n,"ja"));
}
function render(){
  const all=teamsOf(cur),act=new Set(all.filter(t=>!ex.has(t)));
  $("chips").innerHTML=all.map(t=>`<button class="chip${ex.has(t)?" off":""}" data-t="${t}">${t}</button>`).join("");
  const vis=cur.m.filter(x=>x[0]<=maxR);
  const full={};calc(vis,new Set(all)).forEach((r,i)=>full[r.n]=i+1);
  const used=vis.filter(x=>act.has(x[1])&&act.has(x[4])).length;
  $("rl").textContent="第"+maxR+"節まで";
  $("info").textContent=act.size+"クラブ ／ 集計対象 "+used+" 試合（第"+maxR+"節までの全"+vis.length+"試合中）";
  if(act.size<1){$("tbl").innerHTML='<tr><td class="empty" colspan="12">クラブを1つ以上選んでください</td></tr>';return}
  const rows=calc(vis,act).map((r,i)=>{
    const d=full[r.n]-(i+1),gd=r.gf-r.ga;
    const dd=d>0?`<span class="up">▲${d}</span>`:d<0?`<span class="dn">▼${-d}</span>`:`<span class="eq">–</span>`;
    return `<tr><td>${i+1}</td><td>${r.n}</td><td class="pt">${r.pt}</td><td>${r.p}</td>${cur.pk?`<td>${r.w}</td><td>${r.pw}</td><td>${r.pl}</td><td>${r.l}</td>`:`<td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>`}<td>${r.gf}</td><td>${r.ga}</td><td>${gd>0?"+":""}${gd}</td><td>${full[r.n]}位 ${dd}</td></tr>`;
  }).join("");
  $("tbl").innerHTML="<thead><tr><th>順</th><th>クラブ</th><th>勝点</th><th>試</th>"+(cur.pk?"<th>勝</th><th>PK勝</th><th>PK負</th><th>敗</th>":"<th>勝</th><th>分</th><th>敗</th>")+"<th>得</th><th>失</th><th>差</th><th>通常</th></tr></thead><tbody>"+rows+"</tbody>";
}
function setDS(ds){
  cur=ds;ex.clear();maxR=rounds(ds);
  const r=$("round");r.max=maxR;r.value=maxR;
  $("src").textContent=ds.src!==undefined?ds.src:(JL.has(ds.league)?SRC:"");
  $("sub").textContent=ds.league+" "+ds.season+"（"+ds.note+"）";
  $("season").value=ds.season;fillLeague(ds.season);$("league").value=ds.league;
  render();
}
function fillLeague(season){
  const ex=season.includes("J2・J3")?["EAST-A","EAST-B","WEST-A","WEST-B","総合"]:season.includes("特別")?["EAST","WEST","総合"]:["J1","J2","J3"];
  $("league").innerHTML=ex.map(l=>{const ok=DATA.some(d=>d.season===season&&d.league===l);return `<option value="${l}"${ok?"":" disabled"}>${l}${ok?"":"（準備中）"}</option>`}).join("");
}
function init(){
  const seasons=[...new Set(DATA.map(d=>d.season))];
  $("season").innerHTML=seasons.map(s=>`<option>${s}</option>`).join("");
  $("season").onchange=e=>{const s=e.target.value;setDS(DATA.find(d=>d.season===s&&d.league===$("league").value)||DATA.find(d=>d.season===s))};
  $("league").onchange=e=>{const l=e.target.value,s=$("season").value;setDS(DATA.find(d=>d.season===s&&d.league===l))};
  $("round").oninput=e=>{maxR=+e.target.value;render()};
  $("chips").onclick=e=>{const b=e.target.closest("button[data-t]");if(!b)return;const t=b.dataset.t;ex.has(t)?ex.delete(t):ex.add(t);render()};
  $("all").onclick=()=>{ex.clear();render()};
  $("none").onclick=()=>{teamsOf(cur).forEach(t=>ex.add(t));render()};
  setDS(DATA.find(d=>d.season==="2026/27"&&d.league==="J1")||DATA[0]);
}
try{init()}catch(e){document.getElementById("info").textContent="エラー: "+e.message}
</script></body></html>
